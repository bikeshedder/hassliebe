[package]
name = "hassliebe"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Typed Home Assistant MQTT discovery payloads. Serde structs, no MQTT client, no runtime."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bikeshedder/hassliebe"
readme = "README.md"
keywords = ["home-assistant", "mqtt", "discovery", "smart-home", "serde"]
categories = ["data-structures", "encoding"]

[features]
default = ["builder"]
builder = ["dep:derive_builder"]
json = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_builder = { version = "0.20", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
pretty_assertions = "1"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
